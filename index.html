  <head>

    <!-- Favicon: same icon set as https://photovoltaik.marketing/ (source of
         the rechner.photovoltaik.marketing subdomain), downloaded into
         public/ so Vite serves them at the domain root. -->
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Photovoltaik-Rechner | Lohnt sich Solar für Ihr Dach?" />
    <meta property="og:description" content="Berechnen Sie in 60 Sekunden Ertrag, Ersparnis und Amortisation Ihrer Solaranlage — auf Basis echter EU-Satellitendaten für Ihren Standort." />
    <meta property="og:image" content="https://rechner.photovoltaik.marketing/og-image.jpg" />

    <meta property="og:image:type" content="image/jpeg" />

    <meta name="theme-color" content="#141B22" />

    <!-- Body text stays on the system font stack (no webfont load needed for
         90% of the page) — only the display face (headlines, big numbers) is
         a webfont. See PRODUCT_DESIGN.md. -->
    <!-- LCP: erstes Hero-Foto sofort mitladen, nicht erst nach dem JS-Bundle.
         Vite ersetzt den Pfad beim Build durch die gehashte Datei. -->
    <link rel="preload" as="image" href="/src/assets/hero/hero-panels-sky-800.webp" media="(max-width: 700px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/hero/hero-panels-sky-1280.webp" media="(min-width: 701px)" fetchpriority="high" />
    <!-- Space Grotesk (SIL OFL, public/fonts/) wird selbst ausgeliefert: kein Aufruf
         bei Google, damit keine IP-Weitergabe (DSGVO). Die Überschrift (700)
         wird vorab geladen; font-display: swap zeigt sofort die Fallback-Schrift. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-700.woff2" crossorigin />

    <style>
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/space-grotesk-500.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/space-grotesk-600.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/space-grotesk-700.woff2') format('woff2'); }
      /* Kein grauer/weißer Tipp-Blitz auf Mobilgeräten und kein Fokusring nach
         Maus-/Touch-Klick — der Tastatur-Fokus (focus-visible) bleibt sichtbar. */
      button, a { -webkit-tap-highlight-color: transparent; }
      button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
      button:focus-visible, a:focus-visible { outline: 2px solid #1B2160; outline-offset: 2px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F6F8F7; -webkit-font-smoothing: antialiased; min-height: 100vh; }

      /* Global reduced-motion kill-switch: shuts transitions/animations off
         entirely rather than just shortening them, per CLAUDE.md. Component-
         level JS (see Reveal.jsx) additionally skips the scroll-reveal state
         entirely so content isn't gated behind an IntersectionObserver at all. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
